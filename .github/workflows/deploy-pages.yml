# GitHub Pages へのビルド・デプロイ
# - main への push でビルド（Markdown・docs/・output/ だけの変更ではビルドしない）
# - Actions タブから手動実行も可能（workflow_dispatch）
#
# セキュリティ方針:
# - サードパーティ（actions/*）はタグではなくコミット SHA で固定（コメントは対応バージョン）。更新は Dependabot の PR で行う
# - 権限はジョブ単位で最小化（Pages 書き込み・OIDC は deploy ジョブのみ）
# - checkout の認証情報はワークスペースに残さない
# - 依存キャッシュは使わない（キャッシュ汚染の回避。npm ci は package-lock.json どおりに毎回取得）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'output/**'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions: {}

# 連続 push 時は順番に処理（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
